<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Programação da Reunião do Meio da Semana</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

        <button id="btn-proxima" class="btn-nav btn-proxima">Próxima Semana ➡️</button>

    </header>

    <main>

    <script src="config.js"></script>
    <script src="idiomas.js"></script>

    
    <!-- Arquivo de script que busca os dados e monta a página -->

    <script>

        document.addEventListener("DOMContentLoaded", () => {
            carregarDadosReuniao();
        });
