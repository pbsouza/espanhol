<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programação Mensal - Fim de Semana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div style="position: fixed; top: 12px; right: 12px; z-index: 99999;">
        <button id="btn-hamburguer" style="background-color: #143109 !important; color: #ffffff !important; border: none; font-size: 1.1rem !important; padding: 0 !important; border-radius: 4px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; width: 32px !important; height: 32px !important; min-width: 32px !important; min-height: 32px !important; font-weight: bold; line-height: 1;">
            ☰
        </button>

        <div id="menu-opcoes" style="display: none; position: absolute; top: 38px; right: 0; background: #ffffff !important; border: 1px solid rgba(0,0,0,0.08); border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); width: 230px; overflow: hidden; padding: 5px 0;">
            <a href="index.html" style="display: flex; align-items: center; padding: 11px 16px; color: #143109 !important; text-decoration: none; font-weight: 600; font-size: 0.9rem; background-color: #ffffff !important; transition: background 0.2s;">
                <span style="margin-right: 10px; font-size: 1rem;">🏠</span> Página Inicial
            </a>
            <div style="height: 1px; background: rgba(0,0,0,0.06); margin: 0 12px;"></div>
            
            <a href="reuniao_fim_semana.html" style="display: flex; align-items: center; padding: 11px 16px; color: #143109 !important; text-decoration: none; font-weight: 600; font-size: 0.9rem; background-color: #f4f6f3 !important; border-left: 3px solid #143109; ">
                <span style="margin-right: 10px; font-size: 1rem;">📅</span>Fim de Semana
            </a>
            <div style="height: 1px; background: rgba(0,0,0,0.06); margin: 0 12px;"></div>
            
            <a href="reuniao_meio_semana.html" style="display: flex; align-items: center; padding: 11px 16px; color: #143109 !important; text-decoration: none; font-weight: 600; font-size: 0.9rem; background-color: #ffffff !important; transition: background 0.2s;">
                <span style="margin-right: 10px; font-size: 1rem;">📅</span>Meio de Semana
            </a>
        </div>
    </div>

    <header style="text-align: center; margin-bottom: 20px;">
        <h1>Reunião Fim de Semana</h1>
        <div class="nav-container">
            <button id="btn-mes-anterior" class="btn-nav"><< Mês Anterior</button>
            <button id="btn-mes-atual" class="btn-nav btn-atual">Mês Atual</button>
            <button id="btn-mes-proximo" class="btn-nav">Próximo Mês >></button>
        </div>
        <h2 id="exibicao-mes-ano" style="margin-top: 15px; color: #2c3e50; text-transform: capitalize;">—</h2>
    </header>

    <main>
        <div id="container-reunioes-mes" class="reuniao-container">
            <p style="text-align: center; color: #777;">Carregando programações do mês...</p>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>

    <div class="acessibilidade-container">
        <span class="acessibilidade-label">Texto:</span>
        <button id="btn-diminuir" class="btn-acessibilidade" title="Diminuir texto">A-</button>
        <button id="btn-normal" class="btn-acessibilidade" title="Texto normal">A</button>
        <button id="btn-aumentar" class="btn-acessibilidade" title="Aumentar texto">A+</button>
    </div>

    <script src="reuniao_fim_semana.js"></script>
</body>
</html>
