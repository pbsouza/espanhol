<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programação Mensal - Fim de Semana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header style="text-align: center; margin-bottom: 20px;">
        <h1>Reunião Fim de Semana</h1>
        <div class="nav-container">
            <button id="btn-mes-anterior" class="btn-nav"><< Mês Anterior</button>
            <button id="btn-mes-atual" class="btn-nav btn-atual">Mês Atual</button>
            <button id="btn-mes-proximo" class="btn-nav">Próximo Mês >></button>
        </div>
        <h2 id="exibicao-mes-ano" style="margin-top: 15px; color: #2c3e50; text-transform: capitalize;">—</h2>
    </header>

    <main>
        <div id="container-reunioes-mes" class="reuniao-container">
            <p style="text-align: center; color: #777;">Carregando programações do mês...</p>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>

    <div class="acessibilidade-container">
        <span class="acessibilidade-label">Texto:</span>
        <button id="btn-diminuir" class="btn-acessibilidade" title="Diminuir texto">A-</button>
        <button id="btn-normal" class="btn-acessibilidade" title="Texto normal">A</button>
        <button id="btn-aumentar" class="btn-acessibilidade" title="Aumentar texto">A+</button>
    </div>

    <script src="reuniao_fim_semana.js"></script>
</body>
</html>
